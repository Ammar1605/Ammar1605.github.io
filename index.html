<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Website Under Development</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f0f0f;
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-align: center;
            padding: 24px;
        }

        .container {
            max-width: 480px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        p {
            font-size: 1.1rem;
            color: #aaaaaa;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>Website Under Development</h1>
        <p>We're working on something great. Please check back soon.</p>
    </div>
</body>

</html>
